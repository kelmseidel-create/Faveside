<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faveside — Child View</title><style>
:root{color-scheme:dark;--bg:#07070b;--line:#ffffff18;--text:#f8f5fa;--muted:#aaa4b1;--pink:#ff3bac;--purple:#895cff;--green:#72e9b3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#ff2aa126,transparent 28%),radial-gradient(circle at 90% 10%,#7040ff2b,transparent 34%),var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}.shell{width:min(980px,92%);margin:0 auto;padding:30px 0 70px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.lock{display:inline-flex;padding:8px 11px;border-radius:999px;background:#72e9b318;color:var(--green);font-size:.75rem;font-weight:900}.hero{padding:70px 0 30px}.eyebrow{color:#ff81cf;text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:900}.hero h1{margin:12px 0;font-size:clamp(3rem,7vw,5.7rem);line-height:.92;letter-spacing:-.07em}.hero p{color:var(--muted);max-width:650px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{min-height:180px;border:1px solid var(--line);border-radius:24px;padding:20px;background:linear-gradient(145deg,#ffffff0a,#ffffff04)}.avatar{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,var(--pink),var(--purple));font-weight:950}.card h2{margin:28px 0 4px;font-size:1.16rem}.card p{margin:0;color:var(--muted);font-size:.84rem}.empty{grid-column:1/-1;padding:48px 22px;text-align:center;border:1px dashed var(--line);border-radius:24px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{padding-top:48px}}
</style></head><body><div class="shell"><div class="top"><div class="brand">faveside</div><div class="lock">🔒 Parent approved</div></div><section class="hero"><div class="eyebrow">Protected Faveside</div><h1 id="title">Loading…</h1><p id="copy">Only creators approved by the parent account will appear here.</p></section><main class="grid" id="grid"></main></div><script>
const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function initials(n){return String(n).split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()||'★'}const id=new URLSearchParams(location.search).get('profile_id');if(!id){$('#title').textContent='Profile not found';$('#grid').innerHTML='<div class="empty">Return to Parent Controls and choose a child profile.</div>'}else{fetch('api/parent.php?action=child_feed&profile_id='+encodeURIComponent(id),{credentials:'same-origin'}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'Unable to open this profile.'),{status:r.status});return d}).then(d=>{$('#title').textContent=d.profile.name+'’s Faveside';$('#copy').textContent='This view is filtered by the parent account. Unapproved creators are not returned by the server.';$('#grid').innerHTML=d.creators.length?d.creators.map(c=>`<article class="card"><div class="avatar">${esc(initials(c.name))}</div><h2>${esc(c.name)}</h2><p>${esc(c.handle||c.category||'Approved creator')}</p></article>`).join(''):'<div class="empty">No creators are approved for this profile yet.</div>'}).catch(e=>{if(e.status===401){location.href='account.html';return}$('#title').textContent='Protected profile unavailable';$('#copy').textContent=e.message;$('#grid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'})}
</script></body></html>
